<div class="map-page">
  <aside class="panel">
    <a routerLink="/" class="back-link">&larr; Demo index</a>
    <h1>Cell Planet Map</h1>
    <p class="hint">Drag to pan, scroll to zoom, double-click to recenter the projection there.</p>

    <label class="field">
      <span>Cell count: {{ cellCount() }}</span>
      <input
        type="range"
        min="200"
        max="6000"
        step="100"
        [value]="cellCount()"
        (input)="cellCount.set($any($event.target).valueAsNumber)"
      />
    </label>

    <label class="field">
      <span>World profile</span>
      <select
        [value]="worldProfileKind()"
        (change)="worldProfileKind.set($any($event.target).value)"
      >
        @for (kind of worldProfileKinds; track kind) {
          <option [value]="kind">{{ kind }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>Climate: {{ climateExtreme() > 0 ? 'Hot/arid +' : climateExtreme() < 0 ? 'Ice age ' : 'Baseline ' }}{{ climateExtreme().toFixed(2) }}</span>
      <input
        type="range"
        min="-1"
        max="1"
        step="0.05"
        [value]="climateExtreme()"
        (input)="onClimateExtremeInput($any($event.target).valueAsNumber)"
      />
    </label>

    <label class="field">
      <span>Water level: {{ waterLevel() > 0 ? 'Rising +' : waterLevel() < 0 ? 'Falling ' : 'Baseline ' }}{{ waterLevel().toFixed(2) }}</span>
      <input
        type="range"
        min="-1"
        max="1"
        step="0.05"
        [value]="waterLevel()"
        (input)="onWaterLevelInput($any($event.target).valueAsNumber)"
      />
    </label>

    <div class="field">
      <span>Season</span>
      <div class="button-row">
        @for (s of seasons; track s) {
          <button
            type="button"
            [class.active]="season() === s"
            (click)="onSeasonChange(s)"
          >
            {{ s }}
          </button>
        }
      </div>
    </div>

    <label class="field">
      <span>Icon density: {{ iconBudget() }}</span>
      <input
        type="range"
        min="0"
        max="4000"
        step="100"
        [value]="iconBudget()"
        (input)="onIconDensityInput($any($event.target).valueAsNumber)"
      />
    </label>

    <div class="button-row">
      <button type="button" (click)="regenerate()">Regenerate</button>
      <button type="button" (click)="randomizeSeed()">Random seed</button>
    </div>

    <label class="checkbox">
      <input type="checkbox" [checked]="showIcons()" (change)="onIconsToggle()" />
      Icons
    </label>
    <label class="checkbox">
      <input type="checkbox" [checked]="showRivers()" (change)="onRiversToggle()" />
      Rivers
    </label>
    <label class="checkbox">
      <input type="checkbox" [checked]="showCellEdges()" (change)="onEdgesToggle()" />
      Cell edges
    </label>

    <button type="button" (click)="resetView()">Reset view</button>
    <button type="button" (click)="resetProjectionCenter()">Reset projection center</button>

    <div class="stats">
      <div>Seed: {{ seed() }}</div>
      <div>Build: {{ buildMs() }}</div>
      <div>Zoom: {{ zoom().toFixed(1) }}x</div>
    </div>
  </aside>

  <div
    class="viewport"
    #viewport
    (wheel)="onWheel($event)"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointerleave)="onPointerUp()"
    (dblclick)="onMapDoubleClick($event)"
  >
    <canvas
      #mapCanvas
      [style.transform]="'translate(' + panX() + 'px,' + panY() + 'px) scale(' + zoom() + ')'"
    ></canvas>
  </div>
</div>
