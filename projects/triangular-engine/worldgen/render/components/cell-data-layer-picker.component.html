<label>
    <span>Data layer</span>
    <select [value]="selectedLayerId()" (change)="onSelectionChange($event)">
      @for (layer of layers(); track layer.id) {
        <option [value]="layer.id" [selected]="layer.id === selectedLayerId()">
          {{ layer.label }}
        </option>
      }
    </select>
</label>
