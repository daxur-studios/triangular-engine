@let size = 637;
<!--Floor-->
<joltRigidBody [motionType]="0" [position]="[0, -1, 0]">
  <mesh [receiveShadow]="true" [castShadow]="false">
    <boxGeometry #boxGeometry [params]="[size, 1, size]" />
    <meshStandardMaterial [params]="{ color: 'lightgray' }" />
  </mesh>

  <joltMeshShape [geometry]="boxGeometry.geometry()" />
</joltRigidBody>

<!--#region tests-->
<joltRigidBody [position]="[0, 242, 0]" [motionType]="2">
  <mesh>
    <sphereGeometry [params]="{ radius: 1 }" />
    <meshStandardMaterial
      [params]="{ color: 'indigo', transparent: true, opacity: 0.5 }"
    />
  </mesh>
  <joltSphereShape [radius]="1" />
</joltRigidBody>

<joltRigidBody [position]="[-19, 11, 0]" [motionType]="2">
  <mesh>
    <boxGeometry [params]="[1, 1, 1]" />
    <meshStandardMaterial
      [params]="{ color: 'indigo', transparent: true, opacity: 0.8 }"
    />
  </mesh>
  <joltBoxShape [params]="[1, 1, 1]" />
</joltRigidBody>

<joltRigidBody [position]="[-2, 30, 2]" [motionType]="2" #joint1Body>
  <mesh>
    <torusKnotGeometry #knot />
    <meshStandardMaterial
      [params]="{ color: 'blue', transparent: true, opacity: 0.8 }"
    />
  </mesh>
  <joltHullShape [geometry]="knot.geometry()" />
</joltRigidBody>

<joltRigidBody [position]="[2, 30, -2]" [motionType]="2" #joint2Body>
  <mesh>
    <torusKnotGeometry #knotJoint2 />
    <meshStandardMaterial
      [params]="{ color: 'pink', transparent: true, opacity: 0.8 }"
    />
  </mesh>
  <joltHullShape [geometry]="knotJoint2.geometry()" />
</joltRigidBody>

<joltFixedConstraint [bodies]="[joint1Body, joint2Body]" />

<!-- Triangle meshes are only supported on static bodies in Jolt -->
<joltRigidBody [position]="[-13, 2, 2]" [motionType]="0">
  <mesh>
    <torusKnotGeometry #knot2 />
    <meshStandardMaterial
      [params]="{ color: 'lightyellow', transparent: true, opacity: 0.8 }"
    />
  </mesh>
  <joltMeshShape [geometry]="knot2.geometry()" />
</joltRigidBody>
<!--#endregion-->
