<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsule bob study</title>
<style>
  :root { color-scheme: light; color: #2b231e; background: #f6efe6; font: 16px/1.4 system-ui, sans-serif; }
  * { box-sizing: border-box; }
  main { max-width: 1040px; margin: auto; padding: 14px 22px 28px; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 12px; }
  h1 { font-family: Georgia, serif; font-weight: 500; font-size: clamp(1.65rem, 4vw, 2.3rem); margin: 0; }
  figure { margin: 0 0 12px; }
  img { display: block; height: auto; width: min(100%, 445px); margin: auto; border-radius: 8px; }
  nav, .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  button { border: 1px solid #c8b6a4; border-radius: 7px; background: #fff9f0; color: inherit; font: inherit; padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: #433127; color: #fff9f0; border-color: #433127; }
  .stages, .controls { display: grid; gap: 10px; }
  .stages { grid-template-columns: 1fr 1fr; }
  section { min-width: 0; overflow: hidden; border-radius: 12px; background: #ede1d2; }
  h2 { margin: 10px 14px 0; font-size: .86rem; font-weight: 650; }
  canvas { display: block; width: 100%; height: clamp(175px, 36vw, 325px); cursor: grab; }
  canvas:active { cursor: grabbing; }
  #orbit-hint { margin: 0 0 10px; color: #62422f; font-size: .86rem; }
  .controls { grid-template-columns: repeat(4, 1fr); margin: 14px 0 10px; }
  label { display: block; }
  output { float: right; color: #62422f; font-variant-numeric: tabular-nums; }
  input { display: block; width: 100%; margin: 6px 0 0; accent-color: #805537; }
  .detail { display: flex; align-items: center; gap: 6px; }
  .detail input { width: auto; margin: 0; }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  [role=status] { color: #62422f; margin: 0; font-size: .9rem; }
  @media (max-width: 760px) {
    main { padding: 14px 12px; }
    .controls { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .controls { grid-template-columns: 1fr; }
  }
</style>
<main>
  <header>
    <h1>Capsule bob study</h1>
    <nav aria-label="View">
      <button data-angle="0" aria-pressed="false">Front</button>
      <button data-angle="40" aria-pressed="false">Three-quarter</button>
      <button data-angle="-90" aria-pressed="true">Side</button>
      <button data-angle="180" aria-pressed="false">Back</button>
    </nav>
  </header>
  <!-- REFERENCE -->
  <p id="orbit-hint">Drag to orbit. Scroll or pinch to zoom.</p>
  <div class="stages">
    <section><h2>Current Three.js bob</h2><canvas id="current" aria-label="Current bob on the workshop head"></canvas></section>
    <section><h2>Brep prototype</h2><canvas id="brep" aria-label="Brep bob on the workshop head"></canvas></section>
  </div>
  <div class="controls"></div>
  <footer>
    <div class="actions">
      <button id="reset" disabled>Reset shape</button>
      <label class="detail"><input type="checkbox" id="grooves" checked> Groove shading</label>
    </div>
    <p role="status">Loading the CAD kernel…</p>
  </footer>
</main>
<!-- WASM -->
<!-- PREVIEW -->
</html>
